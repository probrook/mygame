<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>轮盘游戏 - 修复版</title>
    <style>
        /* 保留你原有样式，新增转盘样式 */
        body { font-family: Arial; max-width: 800px; margin: 50px auto; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
        .btn:hover { background: #45a049; }
        #result { margin-top: 20px; font-size: 20px; }
        /* 转盘样式 */
        #roulette {
            width: 300px; height: 300px; border-radius: 50%; 
            border: 5px solid #333; margin: 30px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; font-weight: bold; background: #f5f5f5;
            transition: all 0.8s ease; /* 旋转动画 */
        }
        .win { color: #4CAF50; } /* 胜利数字颜色 */
        .lose { color: #F44336; } /* 失败数字颜色 */
    </style>
</head>
<body>
    <h1>轮盘游戏</h1>
    <!-- 转盘容器（核心新增） -->
    <div id="roulette">0</div>
    <!-- 你的原有按钮 -->
    <button class="btn" onclick="playGame(0)">简单难度 (0.001 ETH)</button>
    <button class="btn" onclick="playGame(1)">中等难度 (0.002 ETH)</button>
    <button class="btn" onclick="playGame(2)">困难难度 (0.005 ETH)</button>
    <!-- 结果展示 -->
    <div id="result"></div>

    <!-- 修复Web3依赖（国内可访问CDN） -->
    <script src="https://cdn.bootcdn.net/ajax/libs/web3/1.10.0/web3.min.js"></script>
    <script>
        // 全局配置（只改这里的合约地址！）
        const CONTRACT_ADDRESS = "0x2733462966FE2531e1501a389C9afdA06F4e14c3"; 
        const GANACHE_RPC = "http://127.0.0.1:7545";
        let currentDifficulty; // 记录当前选择的难度（用于转盘颜色）

        // ===================== 保留你原有核心逻辑，只修复报错 =====================
        async function playGame(difficulty) {
            currentDifficulty = difficulty; // 记录难度
            const resultDom = document.getElementById("result");
            resultDom.textContent = "交易处理中，请确认MetaMask弹窗...";
            
            // 1. 修复Web3初始化 + 账户undefined问题
            if (!window.web3) {
                if (window.ethereum) {
                    window.web3 = new Web3(window.ethereum);
                    try {
                        await window.ethereum.request({ method: 'eth_requestAccounts' });
                    } catch (err) {
                        resultDom.textContent = "❌ 请先连接MetaMask钱包！";
                        return;
                    }
                } else {
                    window.web3 = new Web3(new Web3.providers.HttpProvider(GANACHE_RPC));
                }
            }
            const web3 = window.web3;
            
            // 修复：加判断避免读取undefined[0]
            const accounts = await web3.eth.getAccounts();
            const playerAccount = accounts[0];
            if (!playerAccount) {
                resultDom.textContent = "❌ 未检测到钱包账户！";
                return;
            }

            // 2. 保留你原有ABI（只新增getGameResult）
            const abi = [
                {
                    "inputs": [{ "name": "_difficulty", "type": "uint8" }],
                    "name": "playGame",
                    "outputs": [],
                    "stateMutability": "payable",
                    "type": "function"
                },
                {
                    "inputs": [
                        { "name": "player", "type": "address" },
                        { "name": "_difficulty", "type": "uint8" },
                        { "name": "blockNumber", "type": "uint256" }
                    ],
                    "name": "getGameResult",
                    "outputs": [
                        { "name": "randomNumber", "type": "uint256" },
                        { "name": "isWinner", "type": "bool" },
                        { "name": "reward", "type": "uint256" }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                }
            ];
            const contract = new web3.eth.Contract(abi, CONTRACT_ADDRESS);

            // 3. 保留你原有入场费逻辑
            let entryFee;
            if (difficulty === 0) entryFee = web3.utils.toWei("0.001", "ether");
            else if (difficulty === 1) entryFee = web3.utils.toWei("0.002", "ether");
            else entryFee = web3.utils.toWei("0.005", "ether");

            try {
                // 4. 保留你原有交易发送逻辑（删除所有事件监听）
                const txReceipt = await contract.methods.playGame(difficulty)
                    .send({ from: playerAccount, value: entryFee, gas: 300000 });

                // 5. 核心修改：用getGameResult替代GamePlayed事件
                const blockNumber = txReceipt.blockNumber;
                const [randomNumber, isWinner, reward] = await contract.methods
                    .getGameResult(playerAccount, difficulty, blockNumber)
                    .call({ from: playerAccount });

                // 6. 保留你原有结果展示 + 新增转盘更新
                const rewardEth = web3.utils.fromWei(reward, "ether");
                const resultText = isWinner 
                    ? `🎉 游戏胜利！随机数：${randomNumber}，奖励：${rewardEth} ETH` 
                    : `😥 游戏失败！随机数：${randomNumber}，奖励：0 ETH`;
                resultDom.textContent = resultText;
                
                // 更新转盘数字和动画
                updateRoulette(randomNumber, isWinner);

            } catch (err) {
                resultDom.textContent = "❌ 游戏失败：" + err.message;
                console.error("错误详情：", err);
            }
        }

        // ===================== 新增：转盘显示功能（不影响原有逻辑） =====================
        // 更新转盘数字+旋转动画+胜负颜色
        function updateRoulette(num, isWinner) {
            const roulette = document.getElementById("roulette");
            // 旋转动画：数字对应角度（360/100=3.6度 per 数字）
            roulette.style.transform = `rotate(${num * 3.6}deg)`;
            roulette.textContent = num;
            // 胜负颜色区分
            roulette.className = isWinner ? "win" : "lose";
        }

        // 页面加载初始化（保留你原有逻辑）
        window.onload = function() {
            // 自动连接钱包（保留）
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_requestAccounts' }).catch(err => {
                    console.log("未连接钱包，可手动点击按钮后授权");
                });
            }
            // 初始化转盘（默认显示0）
            document.getElementById("roulette").textContent = "0";
        };
    </script>
</body>
</html>
