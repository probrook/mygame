<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>轮盘游戏</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
        .btn:hover { background: #45a049; }
        #result { margin-top: 30px; font-size: 20px; color: #333; }
        #error { color: red; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>轮盘游戏</h1>
    <div>
        <button class="btn" onclick="playGame(0)">简单难度 (0.001 ETH)</button>
        <button class="btn" onclick="playGame(1)">中等难度 (0.002 ETH)</button>
        <button class="btn" onclick="playGame(2)">困难难度 (0.005 ETH)</button>
    </div>
    <div id="result"></div>
    <div id="error"></div>

    <!-- 引入Web3.js -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script>
        // 1. 核心配置（只需要改这里的合约地址！）
        const CONTRACT_ADDRESS = "0x2733462966FE2531e1501a389C9afdA06F4e14c3"; // 替换成你的合约地址
        const RPC_URL = "http://127.0.0.1:7545"; // Ganache默认RPC地址

        // 2. 合约ABI（完整适配你的合约，包含GamePlayed事件）
        const ROULETTE_ABI = [
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "name": "player", "type": "address" },
                    { "indexed": false, "name": "difficulty", "type": "uint8" },
                    { "indexed": false, "name": "randomNumber", "type": "uint256" },
                    { "indexed": false, "name": "isWinner", "type": "bool" },
                    { "indexed": false, "name": "reward", "type": "uint256" }
                ],
                "name": "GamePlayed",
                "type": "event"
            },
            {
                "inputs": [{ "name": "_difficulty", "type": "uint8" }],
                "name": "playGame",
                "outputs": [],
                "stateMutability": "payable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getContractBalance",
                "outputs": [{ "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "owner",
                "outputs": [{ "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        // 3. 全局变量
        let web3;
        let rouletteContract;
        let currentAccount;

        // 4. 初始化Web3和合约
        async function init() {
            try {
                // 连接MetaMask或Ganache RPC
                if (window.ethereum) {
                    web3 = new Web3(window.ethereum);
                    await window.ethereum.request({ method: 'eth_requestAccounts' }); // 授权账户
                    currentAccount = (await web3.eth.getAccounts())[0];
                } else {
                    // 备用：直接连接Ganache RPC（无MetaMask时）
                    web3 = new Web3(new Web3.providers.HttpProvider(RPC_URL));
                    currentAccount = (await web3.eth.getAccounts())[0];
                }

                // 创建合约实例（核心：解决undefined问题）
                rouletteContract = new web3.eth.Contract(ROULETTE_ABI, CONTRACT_ADDRESS);
                document.getElementById("error").textContent = "";
                console.log("初始化成功，当前账户：", currentAccount);
            } catch (err) {
                document.getElementById("error").textContent = "初始化失败：" + err.message;
                console.error("初始化错误：", err);
            }
        }

        // 5. 核心游戏函数（修复GamePlayed事件解析）
        async function playGame(difficulty) {
            // 重置结果和错误提示
            document.getElementById("result").textContent = "";
            document.getElementById("error").textContent = "";

            try {
                // 检查初始化
                if (!rouletteContract) {
                    await init();
                }

                // 验证账户
                if (!currentAccount) {
                    throw new Error("未检测到账户，请连接MetaMask");
                }

                // 设置对应难度的入场费
                let entryFee;
                switch (difficulty) {
                    case 0: entryFee = web3.utils.toWei("0.001", "ether"); break; // 简单
                    case 1: entryFee = web3.utils.toWei("0.002", "ether"); break; // 中等
                    case 2: entryFee = web3.utils.toWei("0.005", "ether"); break; // 困难
                    default: throw new Error("无效难度");
                }

                // 调用合约playGame方法
                document.getElementById("result").textContent = "交易处理中，请确认MetaMask弹窗...";
                const receipt = await rouletteContract.methods.playGame(difficulty)
                    .send({
                        from: currentAccount,
                        value: entryFee,
                        gas: 300000 // 足够的Gas上限
                    });

                // 解析GamePlayed事件（从交易回执中获取，避免undefined报错）
                const gameEvent = receipt.events?.GamePlayed;
                if (gameEvent) {
                    const { randomNumber, isWinner, reward } = gameEvent.returnValues;
                    const rewardEth = web3.utils.fromWei(reward, "ether");
                    const resultText = isWinner 
                        ? `🎉 游戏胜利！随机数：${randomNumber}，奖励：${rewardEth} ETH` 
                        : `😥 游戏失败！随机数：${randomNumber}，奖励：0 ETH`;
                    document.getElementById("result").textContent = resultText;
                } else {
                    document.getElementById("result").textContent = "✅ 交易成功，但未解析到游戏结果（请检查合约事件）";
                }

            } catch (err) {
                document.getElementById("error").textContent = "游戏失败：" + err.message;
                console.error("游戏错误：", err);
            }
        }

        // 页面加载时自动初始化
        window.onload = init;
    </script>
</body>
</html>
